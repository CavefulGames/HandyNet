name = "caveful_games/handynet"
version = "0.3.0"
description = "ByteNet fork made more handy"
authors = ["ffrostfall", "jiwonz <me@jiwonz.kr>"]
repository = "https://github.com/CavefulGames/HandyNet"
license = "MIT"
includes = ["src/**", "README.md", "LICENSE", "pesde.toml"]

[target]
environment = "roblox"
lib = "src/lib/init.luau"
build_files = ["src"]

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"
darklua-build = ".pesde/darklua_build/darklua_build.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[engines]
lune = "^0.10.2"
pesde = "^0.7.1"

[dependencies]
signal = { name = "jiwonz/signal", version = "^0.1.0" }

[dev_dependencies]
scripts = { name = "jiwonz/pesde_scripts_rojo", version = "^0.1.0-rc.1", target = "lune" }
darklua_build = { repo = "jiwonz/lune_darklua_build", rev = "b2eb69b" }
scripts_core = { name = "abidbmt/scripts_core", version = "^0.1.0", target = "lune" }

[overrides]
"scripts>core" = "scripts_core"
